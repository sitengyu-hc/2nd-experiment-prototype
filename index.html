<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Terraform Advisor Experiment</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <button class="brand" data-nav="workspaces" aria-label="Go to workspaces">
        <img src="assets/hcp-terraform.svg" alt="HCP Terraform">
        <span>CoolCorp</span>
        <span class="chevron">⌄</span>
      </button>
      <div class="top-actions">
        <button class="icon-button" aria-label="Search">⌕</button>
        <button class="avatar">AB</button>
        <button id="advisor-toggle" class="advisor-toggle">✦ <span>Open Advisor</span></button>
      </div>
    </header>

    <div class="app-shell">
      <nav class="side-nav" aria-label="Primary navigation">
        <button id="nav-collapse" class="nav-collapse" type="button" aria-label="Collapse navigation" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 7-5 5 5 5M16 7l-5 5 5 5"/></svg></button>
        <div class="nav-section">
          <span class="nav-heading">Manage</span>
          <button data-nav="workspaces" title="Projects"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6l2 2h8v10H4V7Z"/><path d="M4 7V5h6l2 2"/></svg><span class="nav-label">Projects</span></button>
          <button title="Stacks"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg><span class="nav-label">Stacks</span></button>
          <button data-nav="workspaces" data-nav-item="workspaces" title="Workspaces"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/></svg><span class="nav-label">Workspaces</span></button>
          <button title="Registry"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg><span class="nav-label">Registry</span></button>
        </div>
        <div class="nav-section">
          <button title="Usage"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="nav-label">Usage</span></button>
          <button title="Settings"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span class="nav-label">Settings</span></button>
        </div>
        <div class="nav-section">
          <span class="nav-heading">Visibility</span>
          <button data-nav="explorer" data-nav-item="explorer" title="Explorer"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.1 4.9-4.9 2.1 2.1-4.9 4.9-2.1Z"/></svg><span class="nav-label">Explorer</span></button>
        </div>
        <div class="nav-section">
          <span class="nav-heading">Developer self-service</span>
          <button title="Developer Portal"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/></svg><span class="nav-label">Developer Portal</span></button>
        </div>
        <div class="nav-section">
          <span class="nav-heading">Cloud Platform</span>
          <button title="HashiCorp Cloud Platform"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="M9 8v8M15 8v8M9 12h6"/></svg><span class="nav-label">HashiCorp Cloud Platform</span></button>
        </div>
      </nav>
      <main id="main-content" tabindex="-1"></main>
      <aside id="advisor" class="advisor is-open" aria-label="Advisor">
        <div class="advisor-header">
          <div>
            <span class="advisor-spark">✦</span>
            <strong>Advisor</strong>
          </div>
          <button id="advisor-close" class="bare-button" aria-label="Close Advisor">×</button>
        </div>
        <div id="conversation" class="conversation" aria-live="polite"></div>
        <div class="composer-wrap">
          <div id="prompt-menu" class="prompt-menu"></div>
          <form id="composer" class="composer">
            <span>＋</span>
            <input id="advisor-input" type="text" placeholder="Ask Advisor..." autocomplete="off">
            <button type="submit">Send</button>
          </form>
          <div class="composer-meta">
            <button type="button" class="mode-pill">⌘ ADVISORY ONLY⌄</button>
            <span>Scope: <strong id="scope">CoolCorp / my-workspace</strong></span>
          </div>
        </div>
      </aside>
    </div>

    <script src="scenario-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
